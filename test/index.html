<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" http-equiv="Content-Type" content="text/html; width=device-width, initial-scale=1; charset=utf-8">
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link rel="stylesheet" type="text/css" href="../style.css">
    <script src="../js/jquery-3.6.0.js"></script>
    <script src="../ru/api-maps.yandex.ru"></script>
    <script>
      //Прелоадер
      function preloader() {
          const body = $('body');

          body.addClass('loaded_hiding');
          window.setTimeout(function () {
              body.addClass('loaded');
              body.removeClass('loaded_hiding');
          }, 500);
      }
      $(window).on('load', function () {
          preloader();
          spoilers();
      });
      //Кнопка вверх
      $(function() {
        $(window).scroll(function() {
          if($(this).scrollTop() != 0) {
            $('#totopbtn').fadeIn();
          } else {
            $('#totopbtn').fadeOut();
          }
        });
          $('#totopbtn').click(function() {
            $('body,html').animate({scrollTop:0},800);
          });
      });
    </script>
    <script>
      $(function () {
        $(".mainpagediv").load("../parts/mainpage.html");
      });
    </script>
  </head>
  <div id="totopbtn"><img src="../images/uparrow.png"></div>
  <body>
    <div id="preloader">
      <p class="preloader_text">...she's calling you...</p>
    </div>
    <div class="menudiv"></div>
    <script>
      $(function () {
        $(".menudiv").load("../parts/menu.html");
      });
    </script>
    <div class="mainpagediv"></div>
    <div class="menuscrdiv"></div>
    <script>
      window.addEventListener("load",function () {
        $(".menuscrdiv").load("../parts/menuscr.html");
      });
    </script>
  </body>
</html>
